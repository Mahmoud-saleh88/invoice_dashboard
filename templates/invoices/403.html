{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>غير مصرح - 403</title>
    <link href="{% static 'plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/style.bundle.css' %}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="{% static 'images/logo.png' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background image — fills entire viewport */
        .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url("{% static 'images/bg.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Dark overlay with low opacity so bg shows but isn't distracting */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(26, 26, 46, 0.82) 0%,
                rgba(22, 33, 62, 0.88) 100%
            );
        }

        /* Content sits above both layers */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            animation: fadeInUp 0.6s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .lock-icon {
            width: 100px;
            height: 100px;
            background: rgba(201, 168, 76, 0.15);
            border: 2px solid rgba(201, 168, 76, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .lock-icon i {
            font-size: 2.5rem;
            color: #C9A84C;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 900;
            color: #C9A84C;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 1rem;
            text-shadow: 0 4px 30px rgba(201, 168, 76, 0.3);
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .error-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #C9A84C, #b89638);
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #C9A84C, #b89638);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(201, 168, 76, 0.35);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(201, 168, 76, 0.5);
            color: #1a1a2e;
            text-decoration: none;
        }

        .btn-home:active {
            transform: translateY(0);
        }

        /* Subtle decorative dots */
        .dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 2.5rem;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(201, 168, 76, 0.4);
        }

        .dots span:nth-child(2) {
            background: rgba(201, 168, 76, 0.7);
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <!-- Background image -->
    <div class="bg-layer"></div>

    <!-- Dark gradient overlay -->
    <div class="bg-overlay"></div>

    <!-- Main content -->
    <div class="content">

        <!-- Lock icon circle -->
        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>

        <!-- 403 number -->
        <div class="error-code">403</div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Title -->
        <div class="error-title">غير مصرح بالوصول</div>

        <!-- Subtitle -->
        <p class="error-subtitle">
            ليس لديك الصلاحيات اللازمة للوصول إلى هذه الصفحة.<br>
            يرجى التواصل مع المسؤول لمنح الصلاحيات المطلوبة.
        </p>

        <!-- Back button -->
        <a href="{% url 'dashboard' %}" class="btn-home">
            <i class="fas fa-home"></i>
            العودة للرئيسية
        </a>

        <!-- Decorative dots -->
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
</div>

<script src="{% static 'plugins/global/plugins.bundle.js' %}"></script>
<script src="{% static 'js/scripts.bundle.js' %}"></script>
</body>
</html>
