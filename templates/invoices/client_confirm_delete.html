{% extends 'base.html' %}
{% load static %}

{% block title %}حذف عميل{% endblock %}

{% block page_title %}حذف عميل{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="data-card">
            <div class="card-header bg-danger text-white">
                <h6><i class="fas fa-exclamation-triangle me-2"></i> تأكيد الحذف</h6>
            </div>
            <div class="card-body p-4 text-center">
                <i class="fas fa-user-times fa-4x text-danger mb-3"></i>
                <h5 class="mb-3">هل أنت متأكد من حذف العميل "{{ client.name }}"؟</h5>
                <p class="text-muted mb-4">هذا الإجراء لا يمكن التراجع عنه.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> نعم، قم بالحذف
                        </button>
                        <a href="{% url 'client_list' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> إلغاء
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
