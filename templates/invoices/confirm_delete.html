{% extends 'base.html' %}
{% block title %}تأكيد الحذف{% endblock %}
{% block page_title %}تأكيد الحذف{% endblock %}
{% block content %}
<div class="data-card" style="max-width:500px;margin:auto;">
  <div class="card-header" style="background:#dc3545;">
    <h6><i class="fas fa-exclamation-triangle me-2"></i>تأكيد الحذف</h6>
  </div>
  <div class="p-4 text-center">
    <i class="fas fa-trash-alt" style="font-size:3rem;color:#dc3545;margin-bottom:16px;"></i>
    <h5>هل أنت متأكد من حذف هذا السجل؟</h5>
    <p class="text-muted">{{ obj }}</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4">نعم، حذف</button>
      <a href="{% url back_url %}" class="btn btn-outline-secondary px-4">إلغاء</a>
    </form>
  </div>
</div>
{% endblock %}
